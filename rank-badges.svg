<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 128" width="768" height="128">
  <!-- 学者声望六级徽章 · 童生/秀才/举人/进士/翰林/太史 · 朱印+青铜金线稿方形印章风 -->
  <defs>
    <style>
      .rank-glyph { font-family: 'Ma Shan Zheng','Noto Serif SC',serif; fill: #EFE6D0; text-anchor: middle; }
    </style>
  </defs>
  <!-- 童生 -->
  <g transform="translate(0,0)">
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#A67C3D" stroke-width="1.5" opacity="0.55"/>
    <rect x="30" y="30" width="68" height="68" rx="6" fill="#B03A2E" opacity="0.55"/>
    <text class="rank-glyph" x="64" y="66" font-size="26">童</text>
    <text class="rank-glyph" x="64" y="94" font-size="26">生</text>
  </g>
  <!-- 秀才 -->
  <g transform="translate(128,0)">
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#A67C3D" stroke-width="1.5" opacity="0.65"/>
    <rect x="30" y="30" width="68" height="68" rx="6" fill="#B03A2E" opacity="0.65"/>
    <text class="rank-glyph" x="64" y="66" font-size="26">秀</text>
    <text class="rank-glyph" x="64" y="94" font-size="26">才</text>
  </g>
  <!-- 举人 -->
  <g transform="translate(256,0)">
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#A67C3D" stroke-width="1.5" opacity="0.75"/>
    <rect x="30" y="30" width="68" height="68" rx="6" fill="#B03A2E" opacity="0.75"/>
    <text class="rank-glyph" x="64" y="66" font-size="26">举</text>
    <text class="rank-glyph" x="64" y="94" font-size="26">人</text>
  </g>
  <!-- 进士 -->
  <g transform="translate(384,0)">
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#A67C3D" stroke-width="1.5" opacity="0.85"/>
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#E9D492" stroke-width="0.8" opacity="0.5"/>
    <rect x="30" y="30" width="68" height="68" rx="6" fill="#B03A2E" opacity="0.85"/>
    <text class="rank-glyph" x="64" y="66" font-size="26">进</text>
    <text class="rank-glyph" x="64" y="94" font-size="26">士</text>
  </g>
  <!-- 翰林 -->
  <g transform="translate(512,0)">
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#A67C3D" stroke-width="2" opacity="0.95"/>
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#E9D492" stroke-width="0.8" opacity="0.7"/>
    <rect x="30" y="30" width="68" height="68" rx="6" fill="#B03A2E" opacity="0.92"/>
    <text class="rank-glyph" x="64" y="66" font-size="26">翰</text>
    <text class="rank-glyph" x="64" y="94" font-size="26">林</text>
  </g>
  <!-- 太史 -->
  <g transform="translate(640,0)">
    <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#E9D492" stroke-width="2"/>
    <rect x="20" y="20" width="88" height="88" rx="8" fill="none" stroke="#E9D492" stroke-width="0.8" opacity="0.7"/>
    <rect x="30" y="30" width="68" height="68" rx="6" fill="#B03A2E"/>
    <text class="rank-glyph" x="64" y="66" font-size="26">太</text>
    <text class="rank-glyph" x="64" y="94" font-size="26">史</text>
    <circle cx="64" cy="14" r="2.5" fill="#E9D492"/>
    <circle cx="14" cy="64" r="2.5" fill="#E9D492"/>
    <circle cx="114" cy="64" r="2.5" fill="#E9D492"/>
    <circle cx="64" cy="114" r="2.5" fill="#E9D492"/>
  </g>
</svg>
